<script>
/* ============================================================
 * 牵星 QIANXING · 01_boot.js
 * 确定性物理核心 —— 引擎、预测线、模拟器三方共用的唯一实现
 * （DESIGN.md §2/§3：半隐式欧拉、分档子步、rails 递推、燃料经济、吞没判定）
 * 本文件禁止任何 DOM/浏览器 API。
 * ============================================================ */
'use strict';

const TAU = Math.PI * 2;
const RAD = Math.PI / 180;

/* ---------- CFG 常量表（DESIGN §3.1） ---------- */
const CFG = {
  G: 6600,                 // px³/(s²·mass)
  DT: 1 / 120,             // 固定物理步长
  EPS: 12,                 // 引力软化 ε
  VMAX: 1000,              // 船速钳制
  SHIP_R: 6,               // 船半径
  // 玩家黑洞
  BH_MU: 1.2e6,            // 基础引力
  IGNITE: 2.2,             // 点火倍率
  BH_R: 16,                // 视界（视觉）
  BH_EAT: 22,              // 吞没判定距离（R+6）
  EAT_STEPS: 14,           // 吞没持续步数（0.1167s）
  STRETCH: 40,             // 拉伸警示带外沿（2.5R）
  STRETCH_MIN: 22,         // 拉伸带内沿（吞没线）
  K: 6,                    // 黑洞光标阻尼系数
  WAKE_T: 0.1,             // 唤醒 μ 线性升满时间
  // 燃料
  FUEL_MAX: 1.2,           // 满罐秒数（限燃料日 0.8）
  FUEL_REGEN: 1 / 3,       // 每秒回充比例（3s 回满）
  FUEL_GATE: 0.15,         // 耗尽后再点火门槛
  // 流程
  CHARGE: 0.6,             // 首杆充能
  QUICK: 0.2,              // 死亡后急充
  SCUTTLE_DISSOLVE: 0.25,  // 弃船溶解
  SCUTTLE_CHARGE: 0.3,     // 弃船后急充
  LOST_T: 0.8,             // 死亡定格
  SKIP_AFTER: 0.25,        // 定格多久后可跳过
  TIMEOUT: 20,             // 单杆超时
  OOB: { x0: -80, x1: 1680, y0: -80, y1: 980 }, // 出界线（含 80px 余量环）
  // 世界
  W: 1600, H: 900, MARGIN: 80,
  // 掠过档位（相对天体表面 r+）
  GRAZE: { g1: 90, g2: 45, g3: 18, p1: 100, p2: 250, p3: 500 },
  NEAR_MISS: 1.2,          // 虫洞近失倍数
  NEAR_MISS_WIDE: 2.2,     // 白闪环倍数
};

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* mulberry32 确定性随机（日更护送用） */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function muOf(b) { return CFG.G * b.mass * (b.type === 'repulsor' ? -1 : 1); }

function parkOf(level) {
  return { x: clamp(level.start.x + 60, 60, 1540), y: 60 };
}

/* ---------- rails：天体轨道（§2.8 确定性递推） ---------- */
function railInit(b) {
  const m = b.movement;
  if (!m) { b._rail = null; return; }
  if (m.kind === 'orbit') {
    const a = m.phaseDeg * RAD;
    b._rail = {
      kind: 'orbit', cx: m.cx, cy: m.cy, R: m.radius,
      ca: Math.cos(a), sa: Math.sin(a),
      cd: Math.cos(TAU / (m.periodSec * 120)), sd: Math.sin(TAU / (m.periodSec * 120)),
    };
  } else {
    b._rail = { kind: 'line', ax: m.ax, ay: m.ay, bx: m.bx, by: m.by, ph: m.phaseDeg * RAD, dph: TAU / (m.periodSec * 120) };
  }
}
function railStep(b) {
  const r = b._rail;
  if (!r) return;
  if (r.kind === 'orbit') {
    const ca = r.ca * r.cd - r.sa * r.sd;
    const sa = r.sa * r.cd + r.ca * r.sd;
    r.ca = ca; r.sa = sa;
    b.x = r.cx + r.R * ca;
    b.y = r.cy + r.R * sa;
  } else {
    r.ph += r.dph;
    const u = (1 - Math.cos(r.ph)) / 2;
    b.x = r.ax + (r.bx - r.ax) * u;
    b.y = r.ay + (r.by - r.ay) * u;
  }
}

/* ---------- 世界构造 ---------- */
function makeWorld(level, opts) {
  opts = opts || {};
  const park = parkOf(level);
  const W = {
    id: level.id, level: level,
    t: 0,                       // 关卡内物理时间（载入即计时，含充能与补发等待）
    phase: 'charge',            // charge | flight | lost | done
    phaseT: 0,
    chargeDur: CFG.CHARGE,
    lostDur: CFG.LOST_T,
    strokes: 0,                 // 杆数（发射即记）
    levelIgnited: false,        // 本关是否点过火（零点火奖励的反面）
    strokeIgnite: false,
    flightT: 0,
    deadCause: null,            // {type, body?, x?, y?}
    nearMissMin: Infinity,      // 本杆与虫洞最小距离
    fuelMode: opts.fuelMax || CFG.FUEL_MAX,
    noIgniteMode: !!opts.noIgnite,
    disableSwallow: level.id === 'c1-l1',
    target: level.target,
    ship: null,                 // {x,y,vx,vy}
    v0: 0,                      // 本杆发射速度（弹弓增速判定基准）
    _slung: false,              // 本杆是否已触发弹弓高光
    bh: {
      x: park.x, y: park.y, tx: park.x, ty: park.y,
      fuel: 1,                  // 罐比例 [0,1]（排空速率 = 1/fuelMode 每秒）
      ignite: false, hold: false,
      wake: false, wakeT: 0,
      eatSteps: 0, everEmpty: false,
    },
    bodies: [],
    graze: [],                  // 每天体 {min, prev, peaked}
    events: [],
  };
  for (const src of level.bodies) {
    const b = { x: src.x, y: src.y, mass: src.mass, r: src.r, type: src.type, hue: src.hue, movement: src.movement, mu: muOf(src) };
    railInit(b);
    W.bodies.push(b);
  }
  resetGraze(W);
  return W;
}

function resetGraze(W) {
  W.graze = W.bodies.map(() => ({ min: Infinity, prev: Infinity, peaked: false }));
}

/* ---------- 发射 / 弃船 / 死亡 ---------- */
function launchShip(W, silent) {
  const L = W.level, sp = L.launch.speed, a = L.launch.angleDeg * RAD;
  W.ship = { x: L.start.x, y: L.start.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp };
  W.v0 = sp;
  W._slung = false;
  W.strokes++;
  W.strokeIgnite = false;
  W.flightT = 0;
  W.nearMissMin = Infinity;
  const bh = W.bh;
  bh.fuel = 1; bh.everEmpty = false; bh.eatSteps = 0; bh.ignite = false;
  if (!bh.wake) { bh.wake = true; bh.wakeT = 0; }
  resetGraze(W);
  W.phase = 'flight'; W.phaseT = 0;
  if (!silent) W.events.push({ t: 'launch', speed: sp, x: W.ship.x, y: W.ship.y });
}

function scuttle(W) {
  if (W.phase !== 'flight') return false;
  W.deadCause = { type: 'scuttle', x: W.ship.x, y: W.ship.y };
  W.ship = null;
  W.phase = 'lost'; W.phaseT = 0;
  W.lostDur = CFG.SCUTTLE_DISSOLVE + CFG.SCUTTLE_CHARGE;
  W.events.push({ t: 'scuttle', x: W.deadCause.x, y: W.deadCause.y });
  return true;
}

function die(W, cause) {
  W.deadCause = cause;
  if (W.ship) { cause.x = W.ship.x; cause.y = W.ship.y; }
  W.ship = null;
  W.phase = 'lost'; W.phaseT = 0; W.lostDur = CFG.LOST_T;
  W.events.push({ t: 'dead', cause: cause.type, body: cause.body, x: cause.x, y: cause.y, nearMiss: W.nearMissMin });
}

/* ---------- 单步推进（1/120s，确定性） ---------- */
function advance(W, inp) {
  const bh = W.bh;
  W.t += CFG.DT;

  // 黑洞光标阻尼跟随（每步采样一次输入；非有限输入保持旧目标）
  const f = 1 - Math.exp(-CFG.K * CFG.DT);
  if (isFinite(inp.tx) && isFinite(inp.ty)) { bh.tx = inp.tx; bh.ty = inp.ty; }
  bh.x += (bh.tx - bh.x) * f;
  bh.y += (bh.ty - bh.y) * f;
  bh.hold = !!inp.hold;

  // rails 前进（充能期照常推进，§4.1 t=关卡内物理时间）
  for (const b of W.bodies) railStep(b);

  if (W.phase === 'charge') {
    W.phaseT += CFG.DT;
    if (W.phaseT >= W.chargeDur) launchShip(W);
  } else if (W.phase === 'flight') {
    stepFlight(W, inp);
  } else if (W.phase === 'lost') {
    W.phaseT += CFG.DT;
    if (inp.skip && W.phaseT >= CFG.SKIP_AFTER) W.phaseT = W.lostDur;
    if (W.phaseT >= W.lostDur) { W.phase = 'charge'; W.phaseT = 0; W.chargeDur = CFG.QUICK; }
  }
}

function stepFlight(W, inp) {
  const s = W.ship, bh = W.bh, ev = W.events;

  // 唤醒斜坡
  if (bh.wake && bh.wakeT < CFG.WAKE_T) bh.wakeT = Math.min(CFG.WAKE_T, bh.wakeT + CFG.DT);

  // 燃料经济（§2.3）
  const canIgnite = bh.wake && !W.noIgniteMode && bh.fuel > 0 && (!bh.everEmpty || bh.fuel >= CFG.FUEL_GATE);
  const igniting = !!inp.hold && canIgnite;
  if (igniting) {
    if (!bh.ignite) ev.push({ t: 'igniteOn' });
    bh.fuel -= CFG.DT / W.fuelMode;
    if (bh.fuel <= 0) { bh.fuel = 0; bh.everEmpty = true; ev.push({ t: 'fuelEmpty' }); }
    if (!W.strokeIgnite || !W.levelIgnited) { W.strokeIgnite = true; W.levelIgnited = true; }
  } else {
    if (bh.ignite) ev.push({ t: 'igniteOff' });
    if (bh.fuel < 1) {
      const was = bh.fuel;
      bh.fuel = Math.min(1, bh.fuel + CFG.DT * CFG.FUEL_REGEN);
      if (was < 1 && bh.fuel >= 1) ev.push({ t: 'fuelFull' });
    }
  }
  bh.ignite = igniting;

  const ramp = bh.wake ? Math.min(1, bh.wakeT / CFG.WAKE_T) : 0;
  const muBH = ramp * CFG.BH_MU * (igniting ? CFG.IGNITE : 1);

  // 分档子步（状态纯函数）
  let nd = 1e18;
  for (const b of W.bodies) {
    const dx = b.x - s.x, dy = b.y - s.y, d2 = dx * dx + dy * dy;
    if (d2 < nd) nd = d2;
  }
  nd = Math.sqrt(nd);
  const n = nd > 160 ? 1 : nd > 80 ? 2 : nd > 40 ? 4 : 8;
  const h = CFG.DT / n;
  const eps2 = CFG.EPS * CFG.EPS;
  const bs = W.bodies, nb = bs.length;
  const tg = W.target;

  for (let k = 0; k < n; k++) {
    // 引力和（按下标序，确定性）
    let ax = 0, ay = 0;
    for (let i = 0; i < nb; i++) {
      const b = bs[i];
      const dx = b.x - s.x, dy = b.y - s.y;
      const d2 = dx * dx + dy * dy, d = Math.sqrt(d2);
      const inv = d > 0 ? b.mu / (d * (d2 + eps2)) : 0;
      ax += dx * inv; ay += dy * inv;
    }
    {
      const dx = bh.x - s.x, dy = bh.y - s.y;
      const d2 = dx * dx + dy * dy, d = Math.sqrt(d2);
      const inv = d > 0 ? muBH / (d * (d2 + eps2)) : 0;
      ax += dx * inv; ay += dy * inv;
    }
    // 半隐式欧拉：先 v 后 x
    s.vx += ax * h; s.vy += ay * h;
    const sp = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
    if (sp > CFG.VMAX) { const sc = CFG.VMAX / sp; s.vx *= sc; s.vy *= sc; }
    s.x += s.vx * h; s.y += s.vy * h;

    // 交付
    {
      const dx = tg.x - s.x, dy = tg.y - s.y;
      const dT = Math.sqrt(dx * dx + dy * dy);
      if (dT < W.nearMissMin) W.nearMissMin = dT;
      if (dT < tg.r) {
        W.phase = 'done'; W.doneAt = W.t;
        W.events.push({ t: 'deliver', x: s.x, y: s.y });
        return;
      }
    }
    // 天体碰撞 + 掠过
    for (let i = 0; i < nb; i++) {
      const b = bs[i];
      const dx = b.x - s.x, dy = b.y - s.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      const g = W.graze[i];
      const surf = d - b.r;
      if (d < b.r + CFG.SHIP_R) { die(W, { type: b.type === 'blackhole' ? 'eatenTerrain' : 'crash', body: i }); return; }
      if (g.prev > b.r + CFG.GRAZE.g3 && d <= b.r + CFG.GRAZE.g3) ev.push({ t: 'grazeEnter', body: i, tier: 3, x: s.x, y: s.y });
      else if (g.prev > b.r + CFG.GRAZE.g2 && d <= b.r + CFG.GRAZE.g2) ev.push({ t: 'grazeEnter', body: i, tier: 2, x: s.x, y: s.y });
      if (d < g.min) g.min = d;
      else if (!g.peaked && g.min < 1e17 && d > g.min + 2) {
        g.peaked = true;
        ev.push({ t: 'grazeTier', body: i, tier: grazeTierOf(b, g.min) });
      }
      g.prev = d;
      void surf;
    }
    // 出界
    if (s.x < CFG.OOB.x0 || s.x > CFG.OOB.x1 || s.y < CFG.OOB.y0 || s.y > CFG.OOB.y1) {
      die(W, { type: 'oob' }); return;
    }
  }

  // 玩家黑洞吞没：每 advance 判一次（14 步 = 0.1167s 恒定，不随子步档位漂移）
  {
    const dx = bh.x - s.x, dy = bh.y - s.y;
    const dBH = Math.sqrt(dx * dx + dy * dy);
    if (dBH < CFG.BH_EAT) {
      bh.eatSteps++;
      if (bh.eatSteps >= CFG.EAT_STEPS && !W.disableSwallow) { die(W, { type: 'eatenSelf' }); return; }
    } else bh.eatSteps = 0;
  }

  // 引力弹弓高光（§9 条目 14）：3R 内速率增益 > 1.3× 只报一次
  if (!W._slung) {
    const sp2 = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
    if (sp2 > W.v0 * 1.3) {
      W._slung = true;
      ev.push({ t: 'slingshot', x: s.x, y: s.y, ratio: sp2 / W.v0 });
    }
  }

  W.flightT += CFG.DT;
  if (W.flightT >= CFG.TIMEOUT) { die(W, { type: 'timeout' }); }
}

function grazeTierOf(b, minD) {
  if (minD < b.r + CFG.GRAZE.g3) return 3;
  if (minD < b.r + CFG.GRAZE.g2) return 2;
  if (minD < b.r + CFG.GRAZE.g1) return 1;
  return 0;
}

/* ---------- 克隆与预测（§2.2 裁决 30：光标冻结约定） ---------- */
function cloneWorld(W) {
  const C = {
    id: W.id, level: W.level,
    t: W.t, phase: W.phase, phaseT: W.phaseT,
    chargeDur: W.chargeDur, lostDur: W.lostDur,
    strokes: W.strokes, levelIgnited: W.levelIgnited, strokeIgnite: W.strokeIgnite,
    flightT: W.flightT, deadCause: null,
    nearMissMin: W.nearMissMin,
    fuelMode: W.fuelMode, noIgniteMode: W.noIgniteMode, disableSwallow: W.disableSwallow,
    target: W.target,
    ship: null, v0: W.v0, _slung: W._slung, bh: null, bodies: [], graze: [], events: [],
  };
  if (W.ship) C.ship = { x: W.ship.x, y: W.ship.y, vx: W.ship.vx, vy: W.ship.vy };
  const bh = W.bh;
  C.bh = {
    x: bh.x, y: bh.y, tx: bh.tx, ty: bh.ty, fuel: bh.fuel,
    ignite: bh.ignite, hold: bh.hold, wake: bh.wake, wakeT: bh.wakeT,
    eatSteps: bh.eatSteps, everEmpty: bh.everEmpty,
  };
  for (const b of W.bodies) {
    const c = { x: b.x, y: b.y, mass: b.mass, r: b.r, type: b.type, hue: b.hue, movement: b.movement, mu: b.mu, _rail: null };
    if (b._rail) {
      const r = b._rail;
      c._rail = r.kind === 'orbit'
        ? { kind: 'orbit', cx: r.cx, cy: r.cy, R: r.R, ca: r.ca, sa: r.sa, cd: r.cd, sd: r.sd }
        : { kind: 'line', ax: r.ax, ay: r.ay, bx: r.bx, by: r.by, ph: r.ph, dph: r.dph };
    }
    C.bodies.push(c);
  }
  for (const g of W.graze) C.graze.push({ min: g.min, prev: g.prev, peaked: g.peaked });
  return C;
}

/* 预测推演：克隆全状态、420 步（3.5s）、每 4 步采点 */
function predictPath(W, hold, steps, sampleEvery) {
  steps = steps || 420; sampleEvery = sampleEvery || 4;
  const C = cloneWorld(W);
  if (C.phase === 'charge') {
    // 充能期：直接按发射矢量起算（黑洞按唤醒斜坡建模）
    const L = C.level, sp = L.launch.speed, a = L.launch.angleDeg * RAD;
    C.ship = { x: L.start.x, y: L.start.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp };
    C.bh.wake = true; C.bh.wakeT = 0;
    C.phase = 'flight';
  }
  const inp = { tx: C.bh.tx, ty: C.bh.ty, hold: !!hold, skip: false };
  const pts = [];
  let end = 'fly', endT = 0;
  for (let i = 0; i < steps; i++) {
    advance(C, inp);
    if (i % sampleEvery === 0 && C.ship) pts.push({ x: C.ship.x, y: C.ship.y });
    if (C.phase === 'done') { end = 'deliver'; endT = (i + 1) * CFG.DT; break; }
    if (C.phase === 'lost') { end = 'dead'; endT = (i + 1) * CFG.DT; break; }
  }
  return { pts, end, endT };
}

/* ---------- 计分（§2.6） ---------- */
function computeGrazePts(W) {
  // 仅交付杆调用：每天体最高档一次
  let total = 0; const per = [];
  for (let i = 0; i < W.bodies.length; i++) {
    const tier = grazeTierOf(W.bodies[i], W.graze[i].min);
    const pts = tier === 3 ? CFG.GRAZE.p3 : tier === 2 ? CFG.GRAZE.p2 : tier === 1 ? CFG.GRAZE.p1 : 0;
    if (pts > 0) per.push({ body: i, tier, pts });
    total += pts;
  }
  return { total, per };
}

function scoreParts(strokes, par, grazePts, noIgnite, timeOk) {
  const base = 1000;
  const save = 400 * Math.max(0, par - strokes);
  const zero = noIgnite ? 500 : 0;
  const timeB = timeOk ? 300 : 0;
  const total = base + save + grazePts + zero + timeB;
  let rating = 'B';
  if (total >= 1400) rating = 'A';
  if (total >= 1800 && noIgnite) rating = 'S';
  return { base, save, graze: grazePts, zero, time: timeB, total, rating };
}

/* ---------- 关卡契约校验（§4.1/§4.2） ---------- */
function validateLevel(L) {
  const errs = [], warns = [];
  const fatal = (m) => errs.push(m);
  if (!(L.chapter >= 1 && L.chapter <= 5)) fatal('chapter 域');
  if (!/^c[1-5]-l[1-6]$/.test(L.id || '')) fatal('id 格式');
  if (!(L.par >= 1 && L.par <= 9)) fatal('par 域');
  const inW = (p) => p && p.x >= 0 && p.x <= 1600 && p.y >= 0 && p.y <= 900;
  if (!inW(L.start)) fatal('start 界外');
  if (!inW(L.target) || !(L.target.r >= 14 && L.target.r <= 60)) fatal('target 域');
  if (!Array.isArray(L.bodies) || L.bodies.length < 1 || L.bodies.length > 6) fatal('bodies 数量');
  for (const b of L.bodies || []) {
    if (!(b.x >= -200 && b.x <= 1800 && b.y >= -200 && b.y <= 1100)) fatal('天体坐标域');
    if (!(b.mass > 0 && b.r > 0)) fatal('mass/r 域');
    if (['planet', 'moon', 'star', 'blackhole', 'repulsor'].indexOf(b.type) < 0) fatal('type 枚举');
    if (!(b.hue >= 0 && b.hue <= 360)) fatal('hue 域');
    if (b.movement) {
      const m = b.movement;
      if (m.kind === 'orbit') {
        if (!(m.radius > 0 && m.periodSec > 0)) fatal('orbit movement 域');
        const a = m.phaseDeg * RAD;
        const px = m.cx + m.radius * Math.cos(a), py = m.cy + m.radius * Math.sin(a);
        if (Math.hypot(px - b.x, py - b.y) > 2) fatal('orbit t=0 位置与静态坐标不符 (>2px)');
      } else if (m.kind === 'line') {
        if (!(m.periodSec > 0)) fatal('line movement 域');
        const u = (1 - Math.cos(m.phaseDeg * RAD)) / 2;
        const px = m.ax + (m.bx - m.ax) * u, py = m.ay + (m.by - m.ay) * u;
        if (Math.hypot(px - b.x, py - b.y) > 2) fatal('line t=0 位置与静态坐标不符 (>2px)');
      } else fatal('movement.kind');
    }
  }
  if (!L.launch || !(L.launch.speed >= 180 && L.launch.speed <= 360)) fatal('launch.speed 域');
  // parTime 复算（不一致仅警告——数据侧已由 node 校验过）
  const d = Math.hypot(L.target.x - L.start.x, L.target.y - L.start.y);
  const pt = Math.ceil(1.2 * d / L.launch.speed + 3 + 1.5 * (L.par - 1));
  if (L.parTime !== pt) warns.push('parTime=' + L.parTime + ' 与公式复算 ' + pt + ' 不一致');
  return { errs, warns, parTime: pt };
}

/* ---------- Node 导出（模拟器共用；浏览器忽略） ---------- */
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    CFG, TAU, RAD, clamp, mulberry32, muOf, parkOf,
    makeWorld, advance, launchShip, scuttle, cloneWorld, predictPath,
    computeGrazePts, scoreParts, grazeTierOf, validateLevel,
  };
}
