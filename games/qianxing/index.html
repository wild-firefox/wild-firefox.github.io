/* Pointer ownership: steering and ignition can be held by separate fingers. */
const POINTERS = { steer: null, fire: null, last: null, offset: null, touch: false };
function usesTouchControls() { return POINTERS.touch || navigator.maxTouchPoints > 0; }
function clearGameInput() {
  POINTERS.steer = POINTERS.fire = POINTERS.last = POINTERS.offset = null;
  GAME.input.hold = false; GAME.input.skip = false;
}
function fireRect() { return { x: V.w - 120, y: V.h - 76, w: 104, h: 56 }; }
function drawTouchControls(g) {
  if (UI.state !== 'playing' || !usesTouchControls()) return;
  const r = fireRect();
  button(g, r.x, r.y, r.w, r.h, GAME.W && GAME.W.noIgniteMode ? '禁点火日' : GAME.input.hold ? '点火中' : '按住点火', () => {}, { primary: true, fs: 16 });
  button(g, 16, V.h - 64, 76, 44, '暂停', enterPaused, { fs: 15 });
}
function setupInput(canvas) {
  const toWorld = e => {
    const off = e.pointerType === 'touch' ? POINTERS.offset : null;
    const w = screenToWorld(e.clientX + (off ? off.x : 0), e.clientY + (off ? off.y : 0));
    return { x: clamp(w.x, -80, 1680), y: clamp(w.y, -80, 980) };
  };
  const capture = e => { try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* Older browsers retain window listeners. */ } };
  const fireInside = (e, margin = 0) => {
    const r = fireRect();
    return e.clientX >= r.x-margin && e.clientX <= r.x+r.w+margin && e.clientY >= r.y-margin && e.clientY <= r.y+r.h+margin;
  };
  const move = e => {
    if (SETTINGS.control === 'relative') {
      if (POINTERS.last) {
        GAME.input.x = clamp(GAME.input.x + (e.clientX - POINTERS.last.x) / V.scale, -80, 1680);
        GAME.input.y = clamp(GAME.input.y + (e.clientY - POINTERS.last.y) / V.scale, -80, 980);
      }
      POINTERS.last = { x: e.clientX, y: e.clientY };
    } else {
      const w = toWorld(e); GAME.input.x = w.x; GAME.input.y = w.y;
    }
    GAME.idleT = 0; GAME.input.active = true;
  };
  window.addEventListener('pointermove', e => {
    UI.hover = { x: e.clientX, y: e.clientY };
    if (UI.state !== 'playing' || UI.trans) return;
    if (e.pointerType === 'touch' && e.pointerId === POINTERS.fire) { GAME.input.hold = fireInside(e, 18); return; }
    if (e.pointerId === POINTERS.steer || (e.pointerType === 'mouse' && POINTERS.steer === null && SETTINGS.control === 'absolute')) move(e);
  }, { passive: true });
  window.addEventListener('pointerdown', e => {
    audioUnlock();
    if (UI.trans) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.pointerType === 'touch') POINTERS.touch = true;
    UI.hover = { x: e.clientX, y: e.clientY };
    const r = fireRect();
    if (UI.state === 'playing' && e.pointerType === 'touch' && fireInside(e)) {
      if (!(GAME.W && GAME.W.noIgniteMode) && POINTERS.fire === null) { POINTERS.fire = e.pointerId; GAME.input.hold = true; capture(e); }
      return;
    }
    for (const b of UI.buttons) {
      if (e.clientX >= b.x && e.clientX <= b.x+b.w && e.clientY >= b.y && e.clientY <= b.y+b.h) {
        if (!b.disabled) { clearGameInput(); SFX.ui('click'); b.cb(); }
        return;
      }
    }
    if (UI.state !== 'playing' || POINTERS.steer !== null) return;
    POINTERS.steer = e.pointerId;
    capture(e);
    // Grabbing the visible black hole keeps the contact offset: no 70px snap.
    const bh = GAME.W && GAME.W.bh;
    const near = bh && Math.hypot(wx(bh.x)-e.clientX, wy(bh.y)-e.clientY) <= 40;
    POINTERS.offset = e.pointerType === 'touch' ? (near ? { x: wx(bh.x)-e.clientX, y: wy(bh.y)-e.clientY } : { x: 0, y: -Math.min(24, 36*V.scale) }) : null;
    POINTERS.last = { x: e.clientX, y: e.clientY };
    move(e);
    GAME.input.skip = true;
    if (e.pointerType !== 'touch') { POINTERS.fire = e.pointerId; GAME.input.hold = true; }
  });
  const up = e => {
    if (e.pointerId === POINTERS.steer) { POINTERS.steer = POINTERS.last = POINTERS.offset = null; GAME.input.skip = false; }
    if (e.pointerId === POINTERS.fire) { POINTERS.fire = null; GAME.input.hold = false; }
  };
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  canvas.addEventListener('lostpointercapture', up);
  window.addEventListener('resize', clearGameInput);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    audioUnlock();
    const k = e.key;
    if (k === 'm' || k === 'M') { audioSetMuted(!AUDIO.muted); return; }
    if (k === 'Escape' || k === 'p' || k === 'P') {
      if (UI.state === 'playing') enterPaused();
      else if (UI.state === 'paused') UI.state = 'playing';
      else if (UI.state === 'select') UI.state = 'title';
      else if (UI.state === 'result') UI.state = 'select';
      return;
    }
    if (UI.state === 'playing') {
      if ((k === 'r' || k === 'R') && GAME.mode === 'campaign' && GAME.W.phase === 'flight') {
        scuttle(GAME.W);
      }
      if (k === ' ') { GAME.input.skip = true; e.preventDefault(); }
      if (k === 'k' || k === 'K') {
        SETTINGS.fxScale = SETTINGS.fxScale >= 1.5 ? 0 : SETTINGS.fxScale + 0.5;
        toast('FX ×' + SETTINGS.fxScale);
      }
    } else if (UI.state === 'paused') {
      if (k === ' ' || k === 'Enter') UI.state = 'playing';
      if ((k === 'r' || k === 'R') && GAME.mode === 'campaign') transitionTo(() => startCampaign(GAME.W.id));
    } else if (UI.state === 'result') {
      if (k === ' ' || k === 'Enter') {
        const rd = GAME.resultData;
        if (rd) {
          continueResult(rd);
        }
      }
      if (k === 'r' || k === 'R') {
        const rd = GAME.resultData;
        if (rd) transitionTo(() => startCampaign(rd.id));
        else if (GAME.dailyResult) transitionTo(() => startDaily());
      }
    } else if (UI.state === 'title') {
      if (k === ' ' || k === 'Enter') transitionTo(() => { startCampaign(continueLevelId()); });
    }
  });
  window.addEventListener('keyup', (e) => { if (e.key === ' ') GAME.input.skip = false; });

  // 切后台自动暂停 + flush（§6.1）
  document.addEventListener('visibilitychange', () => {
    audioVisibility(!document.hidden);
    if (document.hidden) {
      flushSave();
      enterPaused();
    }
  });
  window.addEventListener('blur', () => {
    if (UI.state === 'playing') enterPaused();
  });
}


/* ============================================================
 * 牵星 QIANXING · 09_daily.js
 * 日更护送模式 v1.1（§2.9）：daySeed 场地生成 + 有操作可解、无操作不可解校验 +
 * 三变体 + 3 命连送 + 上局残影 + 音乐循环 + HUD/结算
 * ============================================================ */
'use strict';

const DAILY_TYPES = ['star', 'planet', 'blackhole', 'repulsor'];
const DAILY_BODY = {
  star: { mass: 3000, r: 48 }, planet: { mass: 900, r: 24 },
  blackhole: { mass: 1200, r: 22 }, repulsor: { mass: 900, r: 28 },
};

function genDailyField(seed) {
  const rng = mulberry32(seed);
  const level = {
    id: 'daily', name: '每日护送', par: 99, chapter: 0,
    start: { x: 100, y: 450 },
    target: { x: 1200 + Math.floor(rng() * 280), y: 150 + Math.floor(rng() * 600), r: 26 },
    bodies: [],
    hint: '',
    launch: { speed: 260 + Math.floor(rng() * 40), angleDeg: -15 + Math.floor(rng() * 30) },
    parTime: 99,
  };
  for (let i = 0; i < 3; i++) {
    const type = DAILY_TYPES[Math.floor(rng() * 4)];
    const b = DAILY_BODY[type];
    level.bodies.push({
      x: 500 + Math.floor(rng() * 600), y: 150 + Math.floor(rng() * 600),
      mass: b.mass, r: b.r, type, hue: type === 'star' ? 35 : type === 'repulsor' ? 330 : type === 'blackhole' ? 350 : 205,
      movement: null,
    });
  }
  return level;
}

/* Build with a real, reproducible steering witness; reject unattended delivery.
 * A stationary cursor is enough to demonstrate feasibility, without an online solver.
 * All terrain is retained. Target is selected on that controlled flight only when
 * it stays clear of the entire unattended flight and of every terrain body.
 */
function dailyFlight(level, cursor) {
  const W = makeWorld(level, { noIgnite: true });
  const pts = [];
  for (let i = 0; i < 2500; i++) {
    advance(W, { tx: cursor.x, ty: cursor.y, hold: false, skip: false });
    if (W.ship) pts.push({ x: W.ship.x, y: W.ship.y });
    if (W.phase === 'lost' || W.phase === 'done') break;
  }
  return { points: pts, win: W.phase === 'done', t: W.t };
}
function dailyValidate(level) {
  const idle = dailyFlight(level, parkOf(level));
  const controlled = level.witness ? dailyFlight(level, level.witness) : { win: false };
  return { pass: !idle.win && controlled.win, unattended: idle.win, controlled: controlled.win };
}
function buildDailyLevel(seed) {
  for (let attempt = 0; attempt < 64; attempt++) {
    const lv = genDailyField((seed + attempt * 7919) >>> 0);
    lv.target = { x: 10000, y: 10000, r: 26 };
    const idle = dailyFlight(lv, parkOf(lv)).points;
    const cursors = [{x:650,y:200},{x:650,y:700},{x:1000,y:250},{x:1000,y:650},{x:1300,y:450}];
    for (const cursor of cursors) {
      const points = dailyFlight(lv, cursor).points;
      for (let i = points.length - 1; i >= 0; i -= 12) {
        const p = points[i];
        if (p.x < 1050 || p.x > 1480 || p.y < 100 || p.y > 800) continue;
        if (lv.bodies.some(b => Math.hypot(b.x-p.x,b.y-p.y) < b.r + 90)) continue;
        if (idle.some(q => Math.hypot(q.x-p.x,q.y-p.y) < 65)) continue;
        lv.target = { x: p.x, y: p.y, r: 26 };
        lv.witness = cursor;
        lv.hint = '移动黑洞，改变航向，把飞船牵入虫洞';
        if (dailyValidate(lv).pass) return lv;
        lv.target = { x: 10000, y: 10000, r: 26 };
      }
    }
  }
  // Fail explicitly rather than publishing an unverified or empty field.
  throw new Error('未找到经过验证的每日星域');
}

const DAILY_VARIANTS = ['标准日', '禁点火日', '限燃料日'];

function startDaily() {
  const seed = Math.floor(Date.now() / 86400000);
  const variant = seed % 3;
  let level;
  try { level = buildDailyLevel(seed); }
  catch (error) { console.error(error); toast('星域生成失败，请重试'); return; }
  GAME.mode = 'daily';
  GAME.daily = {
    seed, variant, variantName: DAILY_VARIANTS[variant],
    level,
    lives: 3, ships: 0, combo: 0, comboPeak: 0, score: 0,
    nextMilestone: 1000,
    respawnT: 0,
    trails: [], curTrail: [],
    zeroAll: true,
  };
  GAME.W = makeWorld(level, {
    fuelMax: variant === 2 ? 0.8 : CFG.FUEL_MAX,
    noIgnite: variant === 1,
  });
  bakeLevelSprites(level);
  resetLevelVisualState(level);
  GAME.resultData = null;
  GAME.dailyGhost = (SAVE.daily.lastTrail || []);
  GAME.attemptSession = 0;
  UI.state = 'playing';
  musicStart();
  if (!AUDIO._brown) { AUDIO._brown = true; startBrownPad(); }
  fxText(800, 200, '每日护送 #' + seed + ' · ' + DAILY_VARIANTS[variant], PAL.amberHi, { big: true, life: 2 });
}

function dailyNextShip() {
  const d = GAME.daily;
  if (!d) return;
  if (d.lives <= 0) { dailyFinish(); return; }
  d.respawnT = 0;
  GAME.resultData = null;
  GAME.W = makeWorld(d.level, {
    fuelMax: d.variant === 2 ? 0.8 : CFG.FUEL_MAX,
    noIgnite: d.variant === 1,
  });
  GAME.trail = []; GAME.strokePath = [];
  clearGameInput();
  const park = parkOf(d.level);
  GAME.input.x = park.x; GAME.input.y = park.y;
  GAME.captureAnim = null;
}

/* 统一离场口：停音乐 + 清会话（选关/返回/收工共用） */
function leaveDaily() {
  if (GAME.mode !== 'daily') return;
  musicStop();
  GAME.daily = null;
  GAME.dailyGhost = null;
  GAME.mode = 'campaign';
}

function dailyOnDeliver() {
  const d = GAME.daily;
  d.ships++;
  d.combo++;
  d.comboPeak = Math.max(d.comboPeak, 1 + Math.min(d.combo, 20) * 0.1);
  const mult = 1 + Math.min(d.combo, 20) * 0.1;
  const gr = computeGrazePts(GAME.W).total;
  const zeroStroke = !GAME.W.strokeIgnite;
  if (!zeroStroke) d.zeroAll = false;
  let gain = Math.round(1000 * mult) + gr;
  if (d.variant === 1 && zeroStroke) gain += 200;
  d.score += gain;
  // 记录航迹（≤32 点 @250ms）
  if (d.curTrail.length) d.trails.push(d.curTrail.slice(0, 32));
  d.curTrail = [];
  if (d.trails.length > 10) d.trails.shift();
  fxText(GAME.W.target.x, GAME.W.target.y - 40, '+' + gain + (d.combo > 1 ? '  ×' + mult.toFixed(1) : ''), PAL.ok, { big: true });
  // 补发计时挂主循环（暂停即停，无真实时间漏发）
  d.respawnT = 0.7;
  // 里程碑分档
  if (d.score >= d.nextMilestone) {
    SFX.milestone();
    d.nextMilestone = (Math.floor(d.score / 1000) + 1) * 1000;
  }
  // 连送里程碑（按连送数 combo，坠毁归零后重新计）
  if ([5, 10, 15, 20].indexOf(d.combo) >= 0) {
    fxText(800, 260, '连送 ×' + d.combo, PAL.gold, { big: true, life: 1.4 });
    SFX.comboUp(d.combo);
  }
}

function dailyFinish() {
  const d = GAME.daily;
  if (!d) return;
  musicStop();
  const sameDay = SAVE.daily.date === d.seed;
  SAVE.daily.date = d.seed;
  if (!sameDay) SAVE.daily.bestShips = 0;
  SAVE.daily.bestShips = Math.max(SAVE.daily.bestShips, d.ships);
  SAVE.daily.lastShips = d.ships;
  // 残影存对象（与渲染端读法同构）
  SAVE.daily.lastTrail = d.trails.map(tr => tr.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) })));
  saveSoon();
  GAME.dailyResult = {
    daily: true, seed: d.seed, ships: d.ships, score: d.score,
    variantName: d.variant === 1 && d.zeroAll ? d.variantName + ' · 零点火上局' : d.variantName,
    comboPeak: d.comboPeak, lives: d.lives,
  };
  GAME.daily = null;
  clearGameInput();
  UI.state = 'result';
  UI.resultAnim = 0;
  SFX.levelClear();
}

/* 航迹采样（250ms）由主循环调用 */
function dailySampleTrail() {
  const d = GAME.daily;
  if (!d || !GAME.W || !GAME.W.ship) return;
  const now = GAME.W.t;
  const last = d.curTrail.length ? d.curTrail[d.curTrail.length - 1] : null;
  if (!last || now - last.t >= 0.25) {
    d.curTrail.push({ x: GAME.W.ship.x, y: GAME.W.ship.y, t: now });
    if (d.curTrail.length > 32) d.curTrail.shift();
  }
}

/* ---------- 护送 HUD（§2.9） ---------- */
function drawDailyHUD(g, pad, fs) {
  const d = GAME.daily;
  if (!d) return;
  // 左上命数
  g.textAlign = 'left';
  g.font = '600 ' + fs + 'px "Segoe UI",sans-serif';
  let lives = '[';
  for (let i = 0; i < 3; i++) lives += i < d.lives ? '●' : '·';
  lives += ']';
  g.fillStyle = d.lives > 1 ? PAL.text : PAL.danger;
  g.fillText('命 ' + lives, pad, pad + fs);
  // 顶中分数 + 连送条
  g.textAlign = 'center';
  g.fillStyle = PAL.text;
  g.font = '700 ' + fs * 1.25 + 'px "Segoe UI",sans-serif';
  g.fillText(String(d.score), V.w / 2, pad + fs * 1.3);
  if (d.combo > 0) {
    const comboCol = d.combo >= 15 ? '#ff6b6b' : d.combo >= 10 ? '#ff9f43' : d.combo >= 5 ? PAL.gold : '#48bb78';
    g.fillStyle = comboCol;
    g.font = '600 ' + fs * 0.85 + 'px "Segoe UI","Microsoft YaHei",sans-serif';
    g.fillText('连送 ×' + d.combo + ' · ×' + (1 + Math.min(d.combo, 20) * 0.1).toFixed(1), V.w / 2, pad + fs * 2.5);
  }
  // 里程碑缺口
  g.fillStyle = PAL.textFaint;
  g.font = '400 ' + fs * 0.72 + 'px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillText('下一 1000 分档还差 ' + Math.max(0, d.nextMilestone - d.score), V.w / 2, pad + fs * 3.7);
  // 右上 本局/上局
  g.textAlign = 'right';
  g.fillStyle = PAL.textDim;
  g.font = '500 ' + fs * 0.85 + 'px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillText('本局 ' + d.ships + ' 船 / 上局 ' + (SAVE.daily.lastShips || 0) + ' 船', V.w - pad - 44, pad + fs);
  // 变体标记
  if (d.variant !== 0) {
    g.fillStyle = d.variant === 1 ? PAL.textFaint : PAL.amber;
    g.font = '600 ' + fs * 0.8 + 'px "Segoe UI","Microsoft YaHei",sans-serif';
    g.fillText(d.variantName, V.w - pad - 44, pad + fs * 2.2);
  }
}

function drawDailyResult(g, rd, x0, y0, cw, t) {
  const cx = V.w / 2;
  g.textAlign = 'center';
  g.font = '700 52px "Segoe UI",sans-serif';
  g.fillStyle = PAL.text;
  g.fillText(String(rd.ships) + ' 船', cx, y0 + 120, cw-24);
  g.font = '600 22px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillStyle = PAL.ice;
  g.fillText('得分 ' + rd.score + ' · 峰值倍率 ×' + rd.comboPeak.toFixed(1), cx, y0 + 165, cw-24);
  g.font = '500 16px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillStyle = PAL.textDim;
  g.fillText('💀 剩余 ' + rd.lives + ' 命 · ' + rd.variantName, cx, y0 + 200, cw-24);
  g.fillStyle = PAL.textFaint;
  g.font = '400 14px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillText('历史最佳 ' + SAVE.daily.bestShips + ' 船 · 明天有新的星域', cx, y0 + 230, cw-24);
  const actions = resultActions(rd), width = Math.min(380, cw-24), half = (width-12)/2;
  button(g, cx-width/2, y0+280, half, 44, actions[2].label, actions[2].run, {fs:14});
  button(g, cx+6, y0+280, half, 44, actions[0].label, actions[0].run, {primary:true});
  button(g, cx-width/2, y0+334, width, 44, actions[1].label, actions[1].run, {fs:14});
}


/* ============================================================
 * 牵星 QIANXING · 10_main.js
 * 主循环：固定步 accumulator（DT=1/120）× 慢动作/hit-stop、渲染、启动
 * ============================================================ */
'use strict';

(function boot() {
  const canvas = document.getElementById('cv');
  V.canvas = canvas;
  V.ctx = canvas.getContext('2d', { alpha: false });
  loadSave();
  loadAudioPreference();
  fitCanvas();
  window.addEventListener('resize', fitCanvas);
  bakeAll(20261024);
  setupInput(canvas);
  // 标题叠加在 c1-l1 实时场景上（§6.1；isBg=true 不消耗教学标记）
  loadLevel('c1-l1', true);
  UI.state = 'title';

  // 调试接口
  window.__qx = { GAME, CFG, UI, FX, SAVE, LEVEL_INDEX, dailyValidate, buildDailyLevel };

  let last = performance.now();
  let acc = 0;
  const MAX_DT = 0.1;
  function loop(now) {
    requestAnimationFrame(loop);
    let dtRaw = (now - last) / 1000;
    last = now;
    if (dtRaw > MAX_DT) dtRaw = MAX_DT;
    if (dtRaw <= 0) dtRaw = 1 / 120;

    const W = GAME.W;
    const stepping = W && (UI.state === 'playing' || UI.state === 'title' || UI.state === 'result');
    const ts = stepping ? fxTimeScale() : 0;
    audioSlowmoLP(ts < 1);

    if (stepping && W) {
      // 慢动作改 ft×timeScale，不改 DT（§3.1）
      acc += dtRaw * ts;
      let steps = 0;
      while (acc >= CFG.DT && steps < 12) {
        if (GAME.mode === 'daily' && GAME.daily && GAME.daily.lives <= 0) { acc = 0; break; }
        const inp = UI.state === 'playing' ? {
          tx: GAME.input.x, ty: GAME.input.y,
          hold: GAME.input.hold && W.bh.wake,
          skip: GAME.input.skip && W.phase === 'lost',
        } : { tx: parkOf(W.level).x, ty: parkOf(W.level).y, hold: false, skip: false };
        advance(W, inp);
        acc -= CFG.DT;
        steps++;
        if (W.phase === 'done') break;
      }
      if (UI.state === 'playing') {
        gameFrame(dtRaw);
        if (GAME.mode === 'daily') dailySampleTrail();
      } else {
        // 标题/结算：吸掉事件不演出
        W.events.length = 0;
      }
    }
    fxUpdate(dtRaw);
    renderFrame(dtRaw);
  }
  requestAnimationFrame(loop);
})();

</script>
